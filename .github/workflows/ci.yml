name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install -U pip
          pip install -r requirements.txt
      - name: pytest
        run: python -m pytest -q
      - name: build
        env:
          LAKE_ROOT: /tmp/lake
        run: python -m lakeside build
      - name: verify (expected to fail until debts are paid)
        env:
          LAKE_ROOT: /tmp/lake
        run: python scripts/verify_lake.py || true
      - name: verify json artifact
        if: always()
        env:
          LAKE_ROOT: /tmp/lake
        run: python scripts/verify_lake.py --json > invariants.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: invariants
          path: invariants.json
